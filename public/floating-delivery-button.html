<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botão Flutuante Delivery - iFood & Keeta</title>
  <style>
    /* ============================================================
       ESTILOS DO BOTÃO FLUTUANTE DE DELIVERY (iFood & Keeta)
       ============================================================ */

    /* Container fixo no canto inferior esquerdo da tela */
    .delivery-widget {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* O invólucro principal com transição suave de largura e raio de borda */
    .delivery-shell {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 46px; /* 50% quando 92px x 92px */
      background: #ffffff;
      box-shadow: 
        0 12px 28px rgba(0, 0, 0, 0.22),
        0 4px 10px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      cursor: pointer;
      transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                  height 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-radius 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.45s ease;
      display: flex;
      align-items: center;
    }

    /* ------------------------------------------------------------
       1. ESTADO PADRÃO: TEXTURA DE GLOBO DESLIZANTE (MARQUEE)
       ------------------------------------------------------------ */
    .delivery-globe-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      opacity: 1;
      transition: opacity 0.3s ease;
      background: #fafafa;
    }

    /* Faixa contínua com os logos duplicados para loop infinito perfeito */
    .delivery-track {
      display: flex;
      align-items: center;
      height: 100%;
      width: max-content;
      animation: globeScroll 11s linear infinite;
      will-change: transform;
    }

    /* Animação horizontal linear (efeito textura de globo girando) */
    @keyframes globeScroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* Item individual dentro da faixa deslizante */
    .track-item {
      width: 92px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 14px;
      box-sizing: border-box;
    }

    .track-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      pointer-events: none;
    }

    /* Camada de luz 3D fixa (luz no topo-esquerdo e sombra no inferior-direito) */
    .delivery-globe-lighting {
      position: absolute;
      top: 0;
      left: 0;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      pointer-events: none;
      /* Destaque especular no canto superior esquerdo e volume esférico */
      background: radial-gradient(
        circle at 32% 28%,
        rgba(255, 255, 255, 0.75) 0%,
        rgba(255, 255, 255, 0.25) 26%,
        rgba(255, 255, 255, 0) 58%,
        rgba(0, 0, 0, 0.18) 90%,
        rgba(0, 0, 0, 0.32) 100%
      );
      box-shadow: 
        inset 3px 3px 6px rgba(255, 255, 255, 0.6),
        inset -5px -5px 12px rgba(0, 0, 0, 0.25);
    }

    /* ------------------------------------------------------------
       2. ESTADO EXPANDIDO (HOVER / TOQUE): DOIS BOTÕES INDEPENDENTES
       ------------------------------------------------------------ */
    .delivery-pills-view {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease 0.1s;
      white-space: nowrap;
    }

    /* Botões em formato 'pill' para cada aplicativo */
    .delivery-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .delivery-pill-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    }

    .delivery-pill-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .delivery-pill-btn img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #ffffff;
    }

    /* Estilo do botão iFood */
    .pill-ifood {
      background-color: #EA1D2C;
      color: #ffffff;
    }
    .pill-ifood:hover {
      background-color: #d11220;
    }

    /* Estilo do botão Keeta */
    .pill-keeta {
      background-color: #FFCC00;
      color: #1c1917;
    }
    .pill-keeta:hover {
      background-color: #e6b800;
    }

    /* Botão de fechar sutil em mobile/touch */
    .delivery-close-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f1f1f1;
      color: #666;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin-left: 2px;
      transition: background 0.2s;
    }
    .delivery-close-btn:hover {
      background: #e2e2e2;
      color: #111;
    }

    /* ------------------------------------------------------------
       3. TRANSIÇÃO DE EXPANSÃO (HOVER OU CLASSE .is-expanded)
       ------------------------------------------------------------ */
    /* Ao passar o mouse no desktop OU quando a classe .is-expanded for adicionada via clique/touch */
    .delivery-shell:hover,
    .delivery-shell.is-expanded {
      width: 320px; /* Largura suficiente para os dois pills lado a lado */
      border-radius: 46px;
      box-shadow: 
        0 14px 34px rgba(0, 0, 0, 0.25),
        0 4px 12px rgba(0, 0, 0, 0.12);
    }

    /* Pausa e esconde a textura do globo */
    .delivery-shell:hover .delivery-globe-view,
    .delivery-shell.is-expanded .delivery-globe-view {
      opacity: 0;
      pointer-events: none;
    }
    .delivery-shell:hover .delivery-track,
    .delivery-shell.is-expanded .delivery-track {
      animation-play-state: paused;
    }

    /* Mostra os dois botões clicáveis */
    .delivery-shell:hover .delivery-pills-view,
    .delivery-shell.is-expanded .delivery-pills-view {
      opacity: 1;
      pointer-events: auto;
    }

    /* Exibe o botão de fechar quando expandido no mobile */
    @media (max-width: 768px) {
      .delivery-shell.is-expanded .delivery-close-btn {
        display: flex;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 40px; font-family: sans-serif; background: #f5f5f4;">

  <h1>Prévia do Botão Flutuante de Delivery</h1>
  <p>Passe o mouse (no desktop) ou toque (no celular) no globo circular de 92px no canto inferior esquerdo.</p>

  <!-- ============================================================
       CÓDIGO DO COMPONENTE (COPIE A PARTIR DAQUI)
       ============================================================ -->
  <div class="delivery-widget" id="deliveryWidget">
    <div class="delivery-shell" id="deliveryShell" aria-label="Pedir no iFood ou Keeta">
      
      <!-- Visão 1: Globo Esférico com Textura Deslizante -->
      <div class="delivery-globe-view" aria-hidden="true">
        <!-- Faixa contínua com logos duplicados (loop sem saltos) -->
        <div class="delivery-track">
          <!-- Bloco 1 -->
          <div class="track-item">
            <img src="logo-ifood.png" alt="iFood" onerror="this.src='https://i.imgur.com/g4cIv92.png'">
          </div>
          <div class="track-item">
            <img src="logo-keeta.png" alt="Keeta" onerror="this.src='https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkzgXbFvdsyiw3NgBcq0sS-0H144BA8Z_626ZwmIe_3UFgOfErxvI3DHV2hCPd07XxRyzblFYyWCmZKwXbRNz5rSRrrjs5hiV53z9rKB1g7TC3D4laADo9WECHCnxgky5IXHQaCXzzRiT1E=s680-w680-h510-rw'">
          </div>
          <!-- Bloco 2 (Duplicado para loop perfeito de 10-12s) -->
          <div class="track-item">
            <img src="logo-ifood.png" alt="iFood" onerror="this.src='https://i.imgur.com/g4cIv92.png'">
          </div>
          <div class="track-item">
            <img src="logo-keeta.png" alt="Keeta" onerror="this.src='https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkzgXbFvdsyiw3NgBcq0sS-0H144BA8Z_626ZwmIe_3UFgOfErxvI3DHV2hCPd07XxRyzblFYyWCmZKwXbRNz5rSRrrjs5hiV53z9rKB1g7TC3D4laADo9WECHCnxgky5IXHQaCXzzRiT1E=s680-w680-h510-rw'">
          </div>
        </div>

        <!-- Camada de luz fixa com efeito esférico 3D (não se move) -->
        <div class="delivery-globe-lighting"></div>
      </div>

      <!-- Visão 2: Dois botões independentes revelados ao expandir -->
      <div class="delivery-pills-view">
        <!-- Botão iFood -->
        <a 
          href="https://www.ifood.com.br/delivery/sao-paulo-sp/tapiocas-delegusty-conjunto-habitacional-instituto-adventista/a23a8762-6b06-4ee3-85b0-94ab21a38799?UTM_Medium=share" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="delivery-pill-btn pill-ifood"
          title="Fazer pedido pelo iFood"
        >
          <img src="logo-ifood.png" alt="iFood" onerror="this.src='https://i.imgur.com/g4cIv92.png'">
          <span>iFood</span>
        </a>

        <!-- Botão Keeta -->
        <a 
          href="https://url-eu.mykeeta.com/BtpUQ7rz" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="delivery-pill-btn pill-keeta"
          title="Fazer pedido pela Keeta"
        >
          <img src="logo-keeta.png" alt="Keeta" onerror="this.src='https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkzgXbFvdsyiw3NgBcq0sS-0H144BA8Z_626ZwmIe_3UFgOfErxvI3DHV2hCPd07XxRyzblFYyWCmZKwXbRNz5rSRrrjs5hiV53z9rKB1g7TC3D4laADo9WECHCnxgky5IXHQaCXzzRiT1E=s680-w680-h510-rw'">
          <span>Keeta</span>
        </a>

        <!-- Botão opcional de fechar no mobile -->
        <button type="button" class="delivery-close-btn" id="deliveryCloseBtn" title="Fechar">✕</button>
      </div>

    </div>
  </div>

  <!-- Script para suporte a touch no mobile e comportamento dinâmico -->
  <script>
    (function () {
      var shell = document.getElementById('deliveryShell');
      var closeBtn = document.getElementById('deliveryCloseBtn');

      if (!shell) return;

      // Suporte a dispositivos touch (mobile)
      shell.addEventListener('click', function (e) {
        // Se clicar em um dos links, deixa abrir normalmente
        if (e.target.closest('a')) {
          return;
        }

        // Se clicar no botão fechar, recolhe
        if (e.target.closest('#deliveryCloseBtn')) {
          e.stopPropagation();
          shell.classList.remove('is-expanded');
          return;
        }

        // Se não estiver expandido, expande
        if (!shell.classList.contains('is-expanded')) {
          e.preventDefault();
          shell.classList.add('is-expanded');
        }
      });

      // Fechar ao tocar fora do botão
      document.addEventListener('click', function (e) {
        if (!shell.contains(e.target)) {
          shell.classList.remove('is-expanded');
        }
      });
    })();
  </script>
  <!-- ============================================================
       FIM DO CÓDIGO DO COMPONENTE
       ============================================================ -->

</body>
</html>

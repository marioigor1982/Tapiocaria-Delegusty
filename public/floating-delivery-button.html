<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botão Flutuante Delivery (Crossfade & Expansão) - iFood & Keeta</title>
  <style>
    /* ============================================================
       ESTILOS DO BOTÃO FLUTUANTE DE DELIVERY (iFood & Keeta)
       Puro CSS sem frameworks - Fácil de copiar e usar
       ============================================================ */

    /* Container posicionado fixo no canto da tela */
    .delivery-widget {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Invólucro circular de ~92px com transição de largura para expansão */
    .delivery-shell {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 46px; /* Círculo perfeito no tamanho padrão */
      background: transparent;
      border: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                  background-color 0.3s ease,
                  box-shadow 0.3s ease;
    }

    /* ------------------------------------------------------------
       1. ESTADO PADRÃO: LOGOS SOBREPOSTOS COM CROSSFADE SUAVE
       Ciclo total de 10s: cada logo fica visível 4s e transiciona em 1s
       Ocupam 100% do botão circular sem borda branca ou padding
       ------------------------------------------------------------ */
    .delivery-crossfade-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* Animação com @keyframes controlando opacidade */
    @keyframes crossfadeCycle {
      0%, 40% {
        opacity: 1;
      }
      50%, 90% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    .crossfade-item {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .crossfade-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* Logo 1 (iFood): inicia visível */
    .crossfade-logo-1 {
      animation: crossfadeCycle 10s ease-in-out infinite;
    }

    /* Logo 2 (Keeta): inicia com atraso de metade do ciclo (5s) */
    .crossfade-logo-2 {
      animation: crossfadeCycle 10s ease-in-out infinite -5s;
    }

    /* ------------------------------------------------------------
       2. ESTADO EXPANDIDO (HOVER / TOQUE): DOIS BOTÕES INDEPENDENTES
       ------------------------------------------------------------ */
    .delivery-pills-view {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease 0.08s;
      white-space: nowrap;
    }

    /* Estilo dos botões pills */
    .delivery-pill {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      cursor: pointer;
    }

    .delivery-pill:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.18);
    }

    .delivery-pill:active {
      transform: translateY(0) scale(0.97);
    }

    .delivery-pill img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Cores de cada marca */
    .pill-ifood {
      background-color: #EA1D2C;
      color: #ffffff;
    }
    .pill-ifood:hover {
      background-color: #d11220;
    }

    .pill-keeta {
      background-color: #FFCC00;
      color: #1c1917;
    }
    .pill-keeta:hover {
      background-color: #e6b800;
    }

    /* ------------------------------------------------------------
       3. TRANSIÇÃO AO PASSAR O MOUSE (HOVER) OU TOQUE (.is-active)
       ------------------------------------------------------------ */

    /* Expande de 92px para ~210px e ganha fundo branco para contraste dos pills */
    .delivery-shell:hover,
    .delivery-shell.is-active {
      width: 210px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    /* Pausa o crossfade e zera a opacidade dos logos giratórios */
    .delivery-shell:hover .delivery-crossfade-view,
    .delivery-shell.is-active .delivery-crossfade-view {
      opacity: 0;
      pointer-events: none;
    }

    .delivery-shell:hover .crossfade-item,
    .delivery-shell.is-active .crossfade-item {
      animation-play-state: paused;
    }

    /* Torna os dois botões clicáveis visíveis */
    .delivery-shell:hover .delivery-pills-view,
    .delivery-shell.is-active .delivery-pills-view {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body style="margin: 0; padding: 40px; font-family: sans-serif; background: #f5f5f4;">

  <h1>Prévia do Botão Flutuante de Delivery</h1>
  <p>Passe o mouse (no computador) ou dê um toque (no celular) no botão circular para expandir as opções de iFood e Keeta.</p>

  <!-- ============================================================
       CÓDIGO DO COMPONENTE (COPIE A PARTIR DAQUI)
       ============================================================ -->
  <div class="delivery-widget" id="deliveryWidget">
    <div class="delivery-shell" id="deliveryShell" aria-label="Pedir no iFood ou Keeta">
      
      <!-- 1. Logos sobrepostos com crossfade contínuo (sem borda branca, ocupando 100%) -->
      <div class="delivery-crossfade-view" aria-hidden="true">
        <!-- iFood (Logo 1) -->
        <div class="crossfade-item crossfade-logo-1">
          <img src="logo-ifood.png" alt="iFood" onerror="this.src='https://i.imgur.com/g4cIv92.png'">
        </div>
        <!-- Keeta (Logo 2) -->
        <div class="crossfade-item crossfade-logo-2">
          <img src="logo-keeta.png" alt="Keeta" onerror="this.src='https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkzgXbFvdsyiw3NgBcq0sS-0H144BA8Z_626ZwmIe_3UFgOfErxvI3DHV2hCPd07XxRyzblFYyWCmZKwXbRNz5rSRrrjs5hiV53z9rKB1g7TC3D4laADo9WECHCnxgky5IXHQaCXzzRiT1E=s680-w680-h510-rw'">
        </div>
      </div>

      <!-- 2. Botões independentes ("pills") revelados na expansão -->
      <div class="delivery-pills-view">
        <!-- Botão iFood -->
        <a 
          href="SEU-LINK-IFOOD" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="delivery-pill pill-ifood"
          title="Pedir pelo iFood"
        >
          <img src="logo-ifood.png" alt="iFood" onerror="this.src='https://i.imgur.com/g4cIv92.png'">
          <span>iFood</span>
        </a>

        <!-- Botão Keeta -->
        <a 
          href="SEU-LINK-KEETA" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="delivery-pill pill-keeta"
          title="Pedir pela Keeta"
        >
          <img src="logo-keeta.png" alt="Keeta" onerror="this.src='https://lh3.googleusercontent.com/gps-cs-s/AHRPTWkzgXbFvdsyiw3NgBcq0sS-0H144BA8Z_626ZwmIe_3UFgOfErxvI3DHV2hCPd07XxRyzblFYyWCmZKwXbRNz5rSRrrjs5hiV53z9rKB1g7TC3D4laADo9WECHCnxgky5IXHQaCXzzRiT1E=s680-w680-h510-rw'">
          <span>Keeta</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Script para suporte a touch no mobile -->
  <script>
    (function () {
      var shell = document.getElementById('deliveryShell');
      if (!shell) return;

      // Suporte para dispositivos touch (mobile)
      shell.addEventListener('click', function (e) {
        // Se clicar diretamente em um link aberto, permite navegação normal
        if (e.target.closest('a')) {
          return;
        }

        // Primeiro toque: expande o botão revelando as opções
        if (!shell.classList.contains('is-active')) {
          e.preventDefault();
          shell.classList.add('is-active');
        } else {
          // Se já estiver expandido e clicar fora dos links, recolhe
          shell.classList.remove('is-active');
        }
      });

      // Fechar ao tocar fora do botão
      document.addEventListener('click', function (e) {
        if (!shell.contains(e.target)) {
          shell.classList.remove('is-active');
        }
      });
    })();
  </script>
  <!-- ============================================================
       FIM DO CÓDIGO DO COMPONENTE
       ============================================================ -->

</body>
</html>
